<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dastan">
  <title>Dastan</title>

  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#badge)"/>

  <!-- Left: the model, as a class box. The header band reads as a class at large
       sizes and closes into a solid block when it shrinks, so the silhouette stays
       the same shape at every size. -->
  <rect x="12" y="20" width="17" height="24" rx="3.5" fill="#ffffff"/>
  <rect x="12" y="26.2" width="17" height="2.2" fill="url(#badge)"/>

  <!-- Right: the script it becomes. Decreasing widths read as lines of text. Solid
       white rather than fading, which stays crisp down to 16px. -->
  <rect x="35" y="23" width="17" height="4.4" rx="2.2" fill="#ffffff"/>
  <rect x="35" y="29.8" width="13" height="4.4" rx="2.2" fill="#ffffff"/>
  <rect x="35" y="36.6" width="9" height="4.4" rx="2.2" fill="#ffffff"/>
</svg>
